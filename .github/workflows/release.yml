name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all targets
        run: |
          set -e
          mkdir -p dist release
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*}
            GOARCH=${t#*/}
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
              go build -trimpath -ldflags "-s -w" \
              -o "dist/sph-${GOOS}-${GOARCH}${ext}" ./cmd/sph
          done

      - name: Package
        run: |
          set -e
          cd dist
          for f in sph-darwin-* sph-windows-*; do
            [ -e "$f" ] || continue
            zip -q "../release/${f}.zip" "$f"
          done
          for f in sph-linux-*; do
            [ -e "$f" ] || continue
            tar czf "../release/${f}.tar.gz" "$f"
          done
          cd ../release
          shasum -a 256 * > checksums.txt
          ls -la

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "sph ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "下载对应平台的压缩包，解压即可用（无需安装依赖）。

          | 文件 | 平台 |
          | --- | --- |
          | sph-darwin-arm64.zip | macOS Apple Silicon |
          | sph-darwin-amd64.zip | macOS Intel |
          | sph-linux-amd64.tar.gz | Linux x86_64 |
          | sph-linux-arm64.tar.gz | Linux ARM64 |
          | sph-windows-amd64.zip | Windows x64 |
          | sph-windows-arm64.zip | Windows ARM64 |

          首次使用：\`sph login\` 会自动下载专用浏览器（约 200MB，仅一次）。"
