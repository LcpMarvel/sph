name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            pkg: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            pkg: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: tar
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: tar
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            pkg: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            pkg: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: install cross linker (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: version string
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          SPH_VERSION: ${{ steps.version.outputs.value }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      # 产物命名沿用 v1 的发布物惯例：sph-<os>-<arch>[.zip|.tar.gz]
      - name: name mapping
        id: name
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) echo "artifact=sph-darwin-arm64" >> "$GITHUB_OUTPUT" ;;
            x86_64-apple-darwin)  echo "artifact=sph-darwin-amd64" >> "$GITHUB_OUTPUT" ;;
            x86_64-unknown-linux-gnu)  echo "artifact=sph-linux-amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64-unknown-linux-gnu) echo "artifact=sph-linux-arm64" >> "$GITHUB_OUTPUT" ;;
            x86_64-pc-windows-msvc)   echo "artifact=sph-windows-amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64-pc-windows-msvc)  echo "artifact=sph-windows-arm64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: package (unix)
        if: matrix.pkg == 'tar'
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/sph" "sph-${{ matrix.target }}"
          # 发布物沿用 v1 命名：sph-linux-amd64.tar.gz
          tar czf "release/${{ steps.name.outputs.artifact }}.tar.gz" "sph-${{ matrix.target }}"

      - name: package (zip)
        if: matrix.pkg == 'zip'
        shell: bash
        run: |
          mkdir -p release
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/sph${ext}" "sph-${{ matrix.target }}${ext}"
          zip -q "release/${{ steps.name.outputs.artifact }}.zip" "sph-${{ matrix.target }}${ext}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: release/*
          if-no-files-found: error

  # 插件版本跟随 tag：marketplace 拉的是 main，tag 指向的 commit 里 plugin.json
  # 仍是旧版本，所以在 release 时把新版本回写 main，已装用户才能收到更新提示。
  sync-plugin-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: inject tag version into plugin.json
        run: |
          tmp=$(mktemp)
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' .claude-plugin/plugin.json > "$tmp"
          mv "$tmp" .claude-plugin/plugin.json
      - name: commit back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git diff --cached --quiet || git commit -m "release: plugin.json 版本同步 ${GITHUB_REF_NAME}"
          git push origin main

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: checksums
        run: |
          cd release
          shasum -a 256 * > checksums.txt
          ls -la

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "sph ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "下载对应平台的压缩包，解压即可用（无需安装依赖）。

          | 文件 | 平台 |
          | --- | --- |
          | sph-darwin-arm64.zip | macOS Apple Silicon |
          | sph-darwin-amd64.zip | macOS Intel |
          | sph-linux-amd64.tar.gz | Linux x86_64 |
          | sph-linux-arm64.tar.gz | Linux ARM64 |
          | sph-windows-amd64.zip | Windows x64 |
          | sph-windows-arm64.zip | Windows ARM64 |

          首次使用：\`sph login\` 会自动下载专用浏览器（约 200MB，仅一次，多镜像竞速）。"
