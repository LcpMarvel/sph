name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install chromium (linux)
        if: matrix.os == 'ubuntu-latest'
        # Ubuntu 24.04 的 apt chromium 是 snap 空壳；直接下载 chrome-for-testing
        # （与本项目 pin 版本一致，走 npmmirror 镜像）。
        run: |
          set -e
          curl -fsSL -o /tmp/chrome.zip \
            https://cdn.npmmirror.com/binaries/chrome-for-testing/131.0.6778.204/linux64/chrome-linux64.zip
          unzip -q /tmp/chrome.zip -d /tmp/chrome-bin
      - name: locate chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "SPH_CHROME=/tmp/chrome-bin/chrome-linux64/chrome" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            echo "SPH_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            echo "SPH_CHROME=C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" >> "$GITHUB_ENV"
          fi
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  # 六平台构建验证：每个目标在其原生 runner 上构建（ring 含 C 代码，
  # 跨 OS 交叉（Linux→macOS/Windows）在本工具链下不可行）。
  cross-compile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_linker: aarch64-linux-gnu-gcc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install cross linker (aarch64-linux)
        if: matrix.cross_linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: build
        shell: bash
        run: |
          if [ -n "${{ matrix.cross_linker }}" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.cross_linker }}"
          fi
          cargo build --release --target ${{ matrix.target }}
