<!doctype html>
<meta charset="utf-8">
<title>publish-fixture</title>
<!-- 视频号助手发布流程的最小仿真（离线回归 fixture）。
     结构对齐真实平台的两段式：主页(.brand-name + 发表视频按钮) → 点击后进入创建表单。
     选择器与 DEFAULT_SELECTORS 对齐。 -->
<style>[hidden]{display:none!important}
.vertical-cover-wrap .edit-btn, .horizon-cover-wrap .edit-btn {position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.vertical-img-wrap, .horizon-img-wrap{position:relative;width:120px;height:100px}
.vertical-mask-layer{position:absolute;inset:0;z-index:10;background:#aaa}
</style>
<div id="home">
  <div class="brand-name">视频号 · 助手（fixture）</div>
  <button id="entry" type="button">发表视频</button>
</div>
<div id="create" hidden>
  <input type="file" id="video-file" accept="video/mp4">
  <input class="weui-desktop-form__input" placeholder="填写短标题有机会获得更多流量">
  <div class="input-editor" contenteditable="true"></div>
  <div class="tag-inner">#话题</div>
  <div class="topic-dialog" hidden>
    <input type="text" class="topic-search" placeholder="搜索话题">
    <ul>
      <li>机械科普</li>
      <li>科普知识</li>
    </ul>
  </div>
  <input type="file" id="cover-file" accept="image/jpeg">
  <div class="vertical-cover-wrap"><div class="vertical-img-wrap"><img width="120" height="100" alt=""><div class="edit-btn">编辑</div><div class="vertical-mask-layer"></div></div></div>
  <div class="horizon-cover-wrap"><div class="horizon-img-wrap"><img width="120" height="100" alt=""><div class="edit-btn">编辑</div></div></div>
  <div class="ant-popover" hidden><div class="btn-directly-edit"><button type="button">直接编辑</button></div></div>
  <div class="weui-desktop-dialog__wrp"><div class="cover-set-wrap" hidden>
    <input type="file" id="ratio-cover" accept="image/jpeg,image/jpg,image/png">
    <button type="button" id="cover-confirm">确认</button>
    </div>
  </div>
  <div class="cover-preview-wrap" hidden>封面预览</div>
  <input type="checkbox" class="ant-checkbox-input" id="original-checkbox">
  <div class="form-item">
    <div class="label">添加到合集</div>
    <div class="select-placeholder">选择合集</div>
    <div class="options" hidden><div class="opt"><span>机械系列</span><span>共0个内容</span></div><div class="opt">儿童科普</div></div>
  </div>
  <div class="form-item">
    <div class="label">链接</div>
    <div class="select-placeholder">选择链接</div>
    <div class="options" hidden><div class="opt">公众号文章</div></div>
  </div>
  <div class="form-item">
    <div class="label">活动</div>
    <div class="select-placeholder">不参与活动</div>
    <div class="options" hidden><div class="opt">科学实验挑战赛</div></div>
  </div>
  <div class="form-item">
    <div class="select-placeholder mark-placeholder">视频标注</div>
    <div class="mark-options" hidden>
      <div class="mark-tag-option">含AI生成内容</div>
    </div>
  </div>
  <div class="schedule-row">
    <span class="weui-desktop-form__check-content">不定时</span>
    <span class="weui-desktop-form__check-content">定时</span>
  </div>
  <div class="schedule-panel" hidden>
    <input placeholder="请选择发表时间" id="sched-date">
    <div class="weui-desktop-picker" hidden>
      <div class="weui-desktop-picker__panel__hd"></div>
      <div class="weui-desktop-picker__table"></div>
    </div>
    <input placeholder="请选择时间" id="sched-time">
  </div>
  <button id="submit-btn" type="button">发表</button>
  <div id="result" data-value="">未提交</div>
  <div class="publish-error" hidden></div>
</div>
<script>
window.coverUploads = {}; window.submitCount = 0; window.earlyCoverClick = 0; window.maskRemovedAt = 0; window.firstCoverClickAt = 0;
let coverRatio;
window.dropdownOpens = 0; window.decoyClicks = 0;
const collectionItem = document.querySelector('.form-item');
if (location.search.includes('collectionBelow=1')) collectionItem.style.marginTop = '1600px';
if (location.search.includes('collectionDecoy=1')) {
  const decoy = document.createElement('span');
  decoy.innerText = '机械系列'; decoy.style.fontSize = '1px';
  decoy.onclick = () => window.decoyClicks++;
  document.getElementById('create').prepend(decoy);
  const other = document.createElement('div');
  other.className = 'options'; other.innerHTML = '<div class="opt">机械系列</div>';
  other.onclick = () => window.decoyClicks++;
  document.getElementById('create').prepend(other);
}
if (location.search.includes('collectionTriggerDisplay=1')) {
  collectionItem.style.cssText += ';display:flex;align-items:center;justify-content:space-between;width:600px';
  const trigger = collectionItem.querySelector('.select-placeholder');
  trigger.className = 'post-album-display'; trigger.innerHTML = '<div class="collection-text">选择合集</div>';
}
if (location.search.includes('collectionPrefix=1')) collectionItem.querySelector('.options').innerHTML = '<div class="opt">机械系列 旧期</div><div class="opt">机械系列\n备份</div>';
if (location.search.includes('collectionMissing=1')) collectionItem.querySelector('.options').replaceChildren();
function openCover() { document.querySelector('.cover-set-wrap').hidden = false; document.getElementById('ratio-cover').value = ''; }
document.querySelector('.vertical-cover-wrap .vertical-img-wrap').onclick = () => { window.firstCoverClickAt = Date.now(); if (document.querySelector('.vertical-mask-layer')) { window.earlyCoverClick++; return; } coverRatio = 'portrait'; openCover(); };
document.querySelector('.horizon-cover-wrap .horizon-img-wrap').onclick = () => { if (!window.firstCoverClickAt) window.firstCoverClickAt = Date.now(); if (document.querySelector('.vertical-mask-layer')) { window.earlyCoverClick++; return; } coverRatio = 'landscape'; document.querySelector('.ant-popover').hidden = false; };
document.querySelector('.btn-directly-edit button').onclick = () => { document.querySelector('.ant-popover').hidden = true; if (!location.search.includes('landscapeFail=1')) openCover(); };
document.getElementById('ratio-cover').onchange = function () { window.coverUploads[coverRatio] = this.files[0].name; };
document.getElementById('cover-confirm').onclick = () => { document.querySelector('.cover-set-wrap').hidden = true; };
if (location.search.includes('noLandscape=1')) document.querySelector('.horizon-cover-wrap').remove();
if (location.search.includes('landscapeFail=1')) document.querySelector('.btn-directly-edit button').remove();
document.getElementById('entry').addEventListener('click', function () {
  document.getElementById('home').hidden = true;
  document.getElementById('create').hidden = false;
});
// 选择视频后进入处理态，短暂延迟后封面就绪（模拟平台截帧完成）
document.getElementById('video-file').addEventListener('change', function () {
  if (!this.files.length) return;
  // Preview and decorative edit label appear before upload is finished.
  setTimeout(() => { document.querySelector('.vertical-mask-layer').remove(); window.maskRemovedAt = Date.now(); }, 4500);
  setTimeout(function () {
    document.querySelector(".cover-preview-wrap").hidden = false;
  }, 60);
});
document.getElementById('cover-file').addEventListener('change', function () {
  if (!this.files.length) return;
});
document.getElementById('submit-btn').addEventListener('click', function () {
  window.submitCount++;
  if (!document.querySelector(".cover-preview-wrap").hidden) {
    document.getElementById('result').dataset.value = 'published';
    history.pushState(null, '', '#post/list');
  }
});
// 输入痕迹（供断言）
// 下拉选择：placeholder 点击展开 options，选项点击后回填
document.querySelectorAll('.select-placeholder, .post-album-display').forEach(function (ph) {
  if ((ph.innerText || '').trim() === '视频标注') return;
  ph.addEventListener('click', function () {
    var item = ph.closest('.form-item');
    if (item) {
      var opts = item.querySelector('.options') || document.getElementById('collection-options');
      if (opts) {
        window.dropdownOpens++;
        setTimeout(() => { opts.hidden = false; }, location.search.includes('collectionDelay=1') ? 1500 : 0);
      }
    }
  });
});
document.querySelectorAll('.options .opt').forEach(function (opt) {
  opt.addEventListener('click', function () {
    var item = opt.closest('.form-item') || collectionItem;
    if (location.search.includes('collectionNoop=1') && (item.querySelector('.label').innerText || '').trim() === '添加到合集') return;
    item.querySelector('.select-placeholder, .post-album-display').innerText = (opt.querySelector('span') || opt).innerText;
    if ((location.search.includes('collectionDisplay=1') || location.search.includes('collectionTriggerDisplay=1')) && (item.querySelector('.label').innerText || '').trim() === '添加到合集') {
      const display = item.querySelector('.select-placeholder, .post-album-display');
      const text = document.createElement('div');
      text.className = 'collection-text'; text.innerText = display.innerText;
      display.className = 'post-album-display'; display.replaceChildren(text);
    }
    opt.closest('.options').hidden = true;
  });
});
if (location.search.includes('collectionPortal')) {
  const opts = collectionItem.querySelector('.options');
  opts.id = 'collection-options'; opts.setAttribute('role', 'listbox');
  document.getElementById('create').append(opts);
  if (location.search.includes('collectionPortal=1')) collectionItem.querySelector('.select-placeholder').setAttribute('aria-controls', opts.id);
}
// 视频标注：与真实页一致，点一次选中，再点一次取消。
document.querySelector('.mark-placeholder').addEventListener('click', function () {
  document.querySelector('.mark-options').hidden = false;
});
document.querySelector('.mark-tag-option').addEventListener('mousedown', function (e) {
  e.stopPropagation();
  this.classList.toggle('is-selected');
  document.querySelector('.mark-placeholder').innerText = this.classList.contains('is-selected') ? '含AI生成内容' : '视频标注';
  document.querySelector('.mark-options').hidden = true;
});
// 定时：点"定时"radio 显示面板；点日期 input 弹 picker；点日期回填
document.querySelectorAll('.weui-desktop-form__check-content').forEach(function (sp) {
  if ((sp.innerText || '').trim() === '定时') {
    sp.addEventListener('click', function () {
      document.querySelector('.schedule-panel').hidden = false;
      if (location.search.includes('collectionResetOnSchedule=1')) {
        document.querySelector('.form-item .select-placeholder').innerText = '选择合集';
      }
    });
  }
});
document.getElementById('sched-date').addEventListener('click', function () {
  document.querySelector('.weui-desktop-picker').hidden = false;
});
const fixtureScheduleDate = new Date(Date.now() + 2 * 3600 * 1000);
document.querySelector('.weui-desktop-picker__panel__hd').innerText = (fixtureScheduleDate.getMonth() + 1) + '月';
document.querySelector('.weui-desktop-picker__table').innerHTML = Array.from({length: 31}, (_, i) => '<a>' + (i + 1) + '</a>').join('');
document.querySelectorAll('.weui-desktop-picker__table a').forEach(function (a) {
  a.addEventListener('click', function () {
    document.getElementById('sched-date').value = fixtureScheduleDate.getFullYear() + '-' + String(fixtureScheduleDate.getMonth() + 1).padStart(2, '0') + '-' + a.innerText.padStart(2, '0');
    document.querySelector('.weui-desktop-picker').hidden = true;
  });
});
document.querySelector('.tag-inner').addEventListener('click', function () {
  document.querySelector('.topic-dialog').hidden = false;
});
document.querySelector('[placeholder*="短标题"]').addEventListener('input', function () {
  this.setAttribute('data-value', this.value);
});
</script>
