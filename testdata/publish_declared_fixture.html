<!doctype html>
<meta charset="utf-8">
<title>declared-fixture</title>
<style>[hidden]{display:none!important}</style>
<div>
  <div class="brand-name">视频号 · 助手</div>
  <button type="button">发表视频</button>
</div>
<div>
  <input type="file" id="video-file" accept="video/mp4">
  <div class="cover-preview-wrap">封面预览</div>
  <input class="weui-desktop-form__input" placeholder="填写短标题有机会获得更多流量">
  <div class="input-editor" contenteditable="true"></div>
  <div class="tag-inner">#话题</div>
  <div class="topic-dialog" hidden>
    <input type="text" class="topic-search" placeholder="搜索话题">
    <ul><li>机械科普</li><li>科普知识</li></ul>
  </div>
  <div class="form-item">
    <div class="label">声明原创</div>
    <label class="ant-checkbox-wrapper"><input type="checkbox" class="ant-checkbox-input" checked></label>
  </div>
  <button type="button" id="decl-submit">发表</button>
</div>
<script>
document.querySelector('.tag-inner').addEventListener('click', function () {
  document.querySelector('.topic-dialog').hidden = false;
});
</script>
